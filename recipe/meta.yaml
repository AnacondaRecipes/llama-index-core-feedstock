{% set name = "llama-index-core" %}
{% set version = "0.14.24" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: 4b2eb3af98eecf3579707ef018be0346bd851be2c7660102d88fab0457b95b61

build:
  skip: true # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 1

requirements:
  host:
    - python
    - hatchling
    - pip
  run:
    - python
    - sqlalchemy >=1.4.49
    - dataclasses-json
    - deprecated >=1.2.9.3
    - fsspec >=2023.5.0
    - httpx
    - nest-asyncio >=1.5.8,<2
    - nltk >=3.9.3
    - numpy
    - tenacity >=8.2.0,<10.0.0,!=8.4.0
    - tiktoken >=0.7.0
    - typing-extensions >=4.5.0
    - typing_inspect >=0.8.0
    - requests >=2.31.0
    - aiohttp >=3.8.6,<4
    - networkx >=3.0
    - dirtyjson >=1.0.8,<2
    - tqdm >=4.66.1,<5
    - pillow >=9.0.0
    - pyyaml >=6.0.1
    - wrapt
    - pydantic >=2.8.0
    - filetype >=1.2.0,<2
    - banks >=2.3.0,<3
    - aiosqlite
    - llama-index-workflows >=2.14.0,<3
    - setuptools >=80.9.0
    - platformdirs
    - tinytag >=2.2.0

test:
  imports:
    - llama_index.core
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://www.llamaindex.ai/
  summary: Interface between LLMs and your data.
  description: |
    The core python package to the LlamaIndex library. Core classes and
    abstractions represent the foundational building blocks for LLM
    applications, most notably, RAG. Such building blocks include
    abstractions for LLMs, Vector Stores, Embeddings, Storage, Callables
    and several others.
  license: MIT
  license_file: LICENSE
  license_family: MIT
  doc_url: https://developers.llamaindex.ai/python/framework/
  dev_url: https://github.com/run-llama/llama_index/tree/main/llama-index-core
extra:
  skip-lints:
    # Linter complaining about setuptools being in run, but it is actually a run dependency
    - python_build_tools_in_host
  recipe-maintainers:
    - jan-janssen
    - pavelzw
